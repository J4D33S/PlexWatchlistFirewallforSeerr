<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Media Request Firewall{% endblock %}</title>
  <style>
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #22263a;
      --border:    #2e3250;
      --text:      #e2e8f0;
      --muted:     #8892a4;
      --accent:    #6366f1;
      --accent-h:  #818cf8;
      --green:     #22c55e;
      --red:       #ef4444;
      --yellow:    #f59e0b;
      --radius:    10px;
      --font:      'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 0;
      height: 56px;
    }
    .nav-brand {
      font-weight: 700;
      font-size: 17px;
      color: var(--text);
      text-decoration: none;
      margin-right: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-brand span { color: var(--accent); }
    nav a {
      color: var(--muted);
      text-decoration: none;
      padding: 0 14px;
      height: 56px;
      display: flex;
      align-items: center;
      font-size: 14px;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    nav a:hover, nav a.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    /* ── Layout ── */
    .page { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--muted); }
    .page-header { margin-bottom: 28px; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ── Stats row ── */
    .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 28px;
      flex: 1;
      min-width: 130px;
      text-align: center;
    }
    .stat-num { font-size: 36px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .stat.allow .stat-num { color: var(--green); }
    .stat.block .stat-num { color: var(--red); }
    .stat.skip  .stat-num { color: var(--yellow); }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-allow  { background: #16532a; color: var(--green); }
    .badge-block  { background: #5a1c1c; color: var(--red); }
    .badge-skip   { background: #5a3a00; color: var(--yellow); }
    .badge-dry    { background: #1e2060; color: #818cf8; }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity .15s;
      text-decoration: none;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger  { background: var(--red);    color: #fff; padding: 5px 12px; font-size: 13px; }
    .btn-run {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 15px;
      padding: 10px 24px;
    }

    /* ── Forms ── */
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
    input[type=text], input[type=number], input[type=url],
    input[type=password], select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      padding: 9px 13px;
      font-size: 14px;
      font-family: var(--font);
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .form-row { display: flex; gap: 16px; }
    .form-row .form-group { flex: 1; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* ── Toggle switch ── */
    .toggle-wrap { display: flex; align-items: center; gap: 12px; }
    .toggle {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: var(--border);
      border-radius: 99px;
      cursor: pointer;
      transition: background .2s;
    }
    .slider:before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform .2s;
    }
    input:checked + .slider { background: var(--green); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* ── Alert ── */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .alert-success { background: #16532a40; border: 1px solid var(--green);  color: var(--green); }
    .alert-info    { background: #1e206040; border: 1px solid var(--accent); color: var(--accent-h); }
    .alert-error   { background: #5a1c1c40; border: 1px solid var(--red);   color: var(--red); }
    .badge-user    { background: #1a3a5c; color: #60a5fa; margin-right: 4px; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 48px 24px; color: var(--muted); }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }

    code {
      background: var(--surface2);
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">🔥 <span>Media</span> Firewall</a>
  <a href="/"        class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
  <a href="/ignore"  class="{% if request.url.path == '/ignore' %}active{% endif %}">Block List</a>
  <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">Settings</a>
</nav>

<div class="page">
  {% block content %}{% endblock %}
</div>

</body>
</html>
