# ─────────────────────────────────────────────────────────────────
#  Media Request Firewall — Docker Compose
#
#  Windows:  docker compose up  (Docker Desktop required)
#  Linux:    docker compose up  (or docker-compose up)
#
#  Open http://localhost:7878 in your browser after starting.
# ─────────────────────────────────────────────────────────────────

services:
  firewall:
    build: .
    container_name: media-firewall
    restart: unless-stopped

    ports:
      - "7878:7878"        # Web UI — http://localhost:7878

    env_file:
      - ../.env               # Keys live in parent folder, never in the project

    volumes:
      # Persist the ignore list database across container restarts
      - firewall-data:/app/data

      # Hot-reload source code without rebuilding (development mode)
      # Comment this out for production:
      - .:/app

    environment:
      # These override .env values if you prefer to set them here
      - PYTHONUNBUFFERED=1

    # Optional: only start firewall after your Seerr container is up
    # Uncomment and adjust the service name if Seerr runs in the same stack:
    # depends_on:
    #   - seerr

volumes:
  firewall-data:
    driver: local
